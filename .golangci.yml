version: "2"
linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - depguard
  settings:
    depguard:
      rules:
        no-cli-from-core:
          files:
            - "**/internal/service/**"
            - "**/internal/client/**"
            - "**/internal/provider/**"
            - "**/internal/agent/**"
            - "**/internal/knowledge/**"
            - "**/internal/types/**"
          deny:
            - pkg: "github.com/martianzhang/aigc-cli/internal/cli/"
              desc: "core packages must not depend on CLI/cobra packages"
        # TODO(A1): also forbid internal/mcp -> internal/cli once the
        # image/video/music/balance orchestration moves into service/generate.
    errcheck:
      # Read-side Close and CLI output writes are intentionally fire-and-forget.
      # Write-side Close/Sync is still checked explicitly in the code.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # ONNX Runtime resource teardown; failures are not actionable.
        - (*ort.Tensor).Destroy
        - (*ort.Session).Destroy
        - ort.DestroyEnvironment
  exclusions:
    rules:
      # Test cleanup often ignores Close/Write errors; production code is still
      # covered by errcheck.
      - path: _test\.go
        linters:
          - errcheck
formatters:
  enable:
    - gofmt
run:
  timeout: 3m
