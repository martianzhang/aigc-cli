version: "2"
linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - depguard
    - bodyclose
    - noctx
    - gocritic
    - gosec
  settings:
    depguard:
      rules:
        no-cli-from-core:
          files:
            - "**/internal/service/**"
            - "**/internal/client/**"
            - "**/internal/provider/**"
            - "**/internal/agent/**"
            - "**/internal/knowledge/**"
            - "**/internal/types/**"
          deny:
            - pkg: "github.com/martianzhang/aigc-cli/internal/cli/"
              desc: "core packages must not depend on CLI/cobra packages"
        no-cli-from-mcp:
          files:
            - "**/internal/mcp/**"
          deny:
            - pkg: "github.com/martianzhang/aigc-cli/internal/cli/"
              desc: "MCP must not depend on CLI/cobra packages; inject deps instead"
    gocritic:
      enabled-tags:
        - diagnostic
      disabled-checks:
        # Style preference only; if/else is often clearer than a switch here.
        - ifElseChain
    gosec:
      severity: high
      confidence: high
    errcheck:
      # Read-side Close and CLI output writes are intentionally fire-and-forget.
      # Write-side Close/Sync is still checked explicitly in the code.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # ONNX Runtime resource teardown; failures are not actionable.
        - (*ort.Tensor).Destroy
        - (*ort.Session).Destroy
        - ort.DestroyEnvironment
  exclusions:
    rules:
      # Test cleanup often ignores Close/Write errors; production code is still
      # covered by errcheck.
      - path: _test\.go
        linters:
          - errcheck
      # The SQLite store is local and its methods do not take a context yet.
      # Database cancellation is a separate refactor; keep noctx for HTTP/exec.
      - path: internal/knowledge/(store|id)\.go
        linters:
          - noctx
        text: "database/sql"
formatters:
  enable:
    - gofmt
run:
  timeout: 3m
