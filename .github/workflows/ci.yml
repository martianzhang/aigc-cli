name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: Vet
        run: go vet ./...

  test:
    # Run the suite on every OS we ship. Platform-specific code paths
    # (path/filepath separators, chmod/symlink permissions, os.UserHomeDir,
    # shell selection) are invisible to a Linux-only run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./... -short -count=1 -timeout=10m

  race:
    # The race detector is slow, so run it once on Linux for every package.
    # Platform-specific code paths are covered by the test matrix above.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Race detector
        env:
          CGO_ENABLED: "0"
        run: go test -race ./... -short -count=1 -timeout=25m

  quality:
    # Repo hygiene checks that are independent of the OS matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Docs generation, links and zh/en parity
        run: make docs-check
      - name: Coverage floor
        env:
          CGO_ENABLED: "0"
        run: |
          go test ./... -short -coverprofile=coverage.out -count=1
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: ${total}%"
          awk -v total="$total" 'BEGIN { if (total + 0 < 58.0) { print "coverage " total "% is below the 58% floor"; exit 1 } }'
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  bench:
    # Smoke gate: every tracked benchmark must compile and run. A real
    # regression comparison uses `make bench-baseline` / `make bench-check`.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Benchmark smoke
        env:
          CGO_ENABLED: "0"
        run: go test ./internal/cli/chat ./internal/agent ./internal/session -run '^$' -bench . -benchmem -benchtime=1x

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o aigc-cli .

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, race, quality, bench, build]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            label: linux-amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            label: linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            label: darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            label: darwin-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            label: windows-amd64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build (Windows)
        shell: bash
        if: matrix.goos == 'windows'
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: |
          choco install mingw -y --no-progress 2>/dev/null || true
          export PATH="/c/ProgramData/chocolatey/bin:/c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin:$PATH"
          go mod download
          bash scripts/build-helper.sh
          name="aigc-cli-${{ matrix.label }}.exe"
          go build -ldflags="-s -w" -o "$name" .
          go version -m "$name" > "SBOM-${{ matrix.label }}.txt"
          dll_dir=$(go env GOMODCACHE)/github.com/k2-fsa/sherpa-onnx-go-windows@v1.13.4/lib
          for arch in x86_64-pc-windows-gnu i686-pc-windows-gnu; do
            [ -d "$dll_dir/$arch" ] && { cp "$dll_dir/$arch/"*.dll .; break; }
          done
          7z a "aigc-cli-${{ matrix.label }}.zip" "$name" *.dll || true
          # keep runtime DLLs for standalone asset upload below
          rm -f "$name"
          echo "binary=aigc-cli-${{ matrix.label }}.zip" >> "$GITHUB_ENV"
      - name: Build (Unix - helper + binary)
        shell: bash
        if: matrix.goos != 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          go mod download
          bash scripts/build-helper.sh
          name="aigc-cli-${{ matrix.label }}"
          go build -ldflags="-s -w" -o "$name" .
          go version -m "$name" > "SBOM-${{ matrix.label }}.txt"
          # Pick the sherpa-onnx runtime libs for the build's own architecture.
          # Never use `ls $sherpa_dir/lib | head -1`: it sorts aarch64 first and
          # silently ships ARM64 libs inside the amd64 package.
          os_pkg="${{ matrix.goos }}"; [ "$os_pkg" = "darwin" ] && os_pkg="macos"
          sherpa_dir=$(go env GOMODCACHE)/github.com/k2-fsa/sherpa-onnx-go-${os_pkg}@v1.13.4
          case "${{ matrix.label }}" in
            linux-amd64)  lib_dir="$sherpa_dir/lib/x86_64-unknown-linux-gnu" ;;
            linux-arm64)  lib_dir="$sherpa_dir/lib/aarch64-unknown-linux-gnu" ;;
            darwin-amd64) lib_dir="$sherpa_dir/lib/x86_64-apple-darwin" ;;
            darwin-arm64) lib_dir="$sherpa_dir/lib/aarch64-apple-darwin" ;;
            *) echo "no sherpa-onnx lib mapping for ${{ matrix.label }}"; exit 1 ;;
          esac
          [ -d "$lib_dir" ] || { echo "missing lib dir: $lib_dir"; find "$sherpa_dir/lib" -maxdepth 2; exit 1; }
          # findHelperLib() only looks beside the executable (or in the models
          # dir), so stage a flat package: binary + helper + native libs as
          # siblings, no absolute GOMODCACHE paths inside the archive.
          stage="$RUNNER_TEMP/aigc-pkg"
          rm -rf "$stage"; mkdir -p "$stage"
          cp "$name" libaigc-sherpa-helper.* "$stage"/
          cp "$lib_dir"/*.so "$lib_dir"/*.dylib "$stage"/ 2>/dev/null || true
          # libonnxruntime.dylib is a byte-identical duplicate of the versioned
          # dylib. Keep only libonnxruntime.<ver>.dylib so the package records
          # which ONNX Runtime version it ships (and stays ~28 MB smaller).
          if compgen -G "$stage/libonnxruntime.*.dylib" >/dev/null; then
            rm -f "$stage/libonnxruntime.dylib"
          fi
          ( cd "$stage" && tar czf "$GITHUB_WORKSPACE/aigc-cli-${{ matrix.label }}.tar.gz" * )
          if tar tzf "aigc-cli-${{ matrix.label }}.tar.gz" | grep -q '/'; then
            echo "package must be flat, found nested paths:"
            tar tzf "aigc-cli-${{ matrix.label }}.tar.gz"
            exit 1
          fi
          # keep runtime libs for standalone asset upload below
          cp "$lib_dir"/libsherpa-onnx-c-api.* . 2>/dev/null || true
          echo "binary=aigc-cli-${{ matrix.label }}.tar.gz" >> "$GITHUB_ENV"
      - name: Checksums
        shell: bash
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sums="SHA256SUMS-${{ matrix.label }}.txt"
          sbom="SBOM-${{ matrix.label }}.txt"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ env.binary }}" "$sbom" > "$sums"
          else
            shasum -a 256 "${{ env.binary }}" "$sbom" > "$sums"
          fi
          cat "$sums"
      - name: Upload Release Asset
        shell: bash
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          sums="SHA256SUMS-${{ matrix.label }}.txt"
          sbom="SBOM-${{ matrix.label }}.txt"
          notes_file="docs/release_notes/${tag}.md"
          notes_flag="--generate-notes"
          [ -f "$notes_file" ] && notes_flag="--notes-file $notes_file"

          # Create release with notes, or upload to existing
          gh release create "$tag" "${{ env.binary }}" "$sums" "$sbom" --title "$tag" $notes_flag 2>/dev/null || \
            gh release upload "$tag" "${{ env.binary }}" "$sums" "$sbom" --clobber

          # If release already existed, update notes
          [ -f "$notes_file" ] && gh release edit "$tag" --notes-file "$notes_file" 2>/dev/null || true

          # Upload shared libraries separately (for audio init download)
          for f in libaigc-sherpa-helper.* aigc-sherpa-helper.dll \
                   libsherpa-onnx-c-api.* sherpa-onnx-c-api.dll \
                   libonnxruntime.*.dylib onnxruntime.dll libonnxruntime.so; do
            [ -f "$f" ] && gh release upload "$tag" "$f" --clobber || true
          done
