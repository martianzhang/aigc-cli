# aigc-cli Configuration（示例文件，仓库内这份不会生效）
# 复制到 ~/.config/aigc-cli/config.yaml 后再填自己的 key：
#   mkdir -p ~/.config/aigc-cli && cp docs/zh/examples/config.yaml ~/.config/aigc-cli/config.yaml
# 或在运行时指定 --config /path/to/config.yaml
# ⚠️ 勿直接对本文件运行 `aigc-cli config ...`：CLI 会原地改写文件并加密其中的 key

# ── 全局顶层配置 ──
# 作为所有命令的兜底。当命令没有通过 defaults.{cmd}.provider 引用命名 Provider 时使用。
# 如果配置了 providers 段且命令引用了命名 Provider，则对应字段优先生效。

# API key (can also be set via OPENAI_API_KEY env var)
# 使用本地模型（Ollama / LM Studio / localhost）时可不填
api_key: enc:v1:xTvA5Luio1XZRZZOdCye7wfFfsMKCYgQGvTdFjBPxzFlHdxCwxZJKL1BCR9Q
# API base URL (can also be set via OPENAI_BASE_URL env var)
# ── 按 Provider 取消注释 ──
# OpenAI:    https://api.openai.com/v1
# OpenRouter: https://openrouter.ai/api/v1
# APIMart:    https://api.apimart.ai
# Ollama:    http://localhost:11434 （无需 API Key）
# 任意中转:   https://your-relay.com/v1
base_url: "https://api.apimart.ai"
# HTTP proxy (can also be set via HTTP_PROXY / HTTPS_PROXY env vars, or --http-proxy CLI flag)
# Use the --no-proxy CLI flag to bypass this setting for a single run.
# http_proxy: "http://127.0.0.1:7890"

# Verbose output: show full result JSON (can also use --verbose / -v CLI flag)
# verbose: true

# 零数据保留：将 OpenRouter 的 chat/music 限制为符合 ZDR 的上游。
# 也可用全局 --zdr 命令行参数（flag 优先于此处配置）。
# 其他 Provider 及 OpenRouter 的图片/视频会忽略该项。
# zdr: true

# Output directory for downloaded files (default: current directory ".")
# Can also use --output CLI flag
# output_dir: "./downloads"

# OpenRouter app attribution (optional)
# Set via env vars: OPENAI_REFERER="https://your-site.com" OPENAI_APP_TITLE="Your App"

# Global timeout in seconds for HTTP requests (default: 180s).
# Modality-specific timeout overrides this if set.
# This key only bounds a single HTTP request; async task polling uses
# defaults.<modality>.timeout (and per-media built-in defaults) instead.
# timeout: 300

# ── 工具过滤（MCP / Chat 模式通用）──
# Glob 通配符（* 匹配任意名称）：
#   tools_enable  — 白名单模式，启用列表内的工具（空列表 = 全部允许）
#   tools_disable — 黑名单模式，禁用列表内的工具（在黑名单上附加限制）
# 两者同时设置时，先通过 enable 过滤，再执行 disable 排除。
# Chat 原语：read/grep/find/ls 默认可用（只读）；write/edit/bash/search/fetch/web_search/web_fetch 为特权原语，
# 必须显式列进 tools_enable 才启用。领域工具（generate_* 等）由 MCP 提供。

# 场景 A：白名单 — 只允许免费/离线工具（本地 ONNX / BM25）
# tools_enable:
#   - "search_ideas"       # 本地 BM25 灵感搜索（MCP + Chat）
#   - "detect_image"       # 离线 AIGC 检测
#   - "remove_watermark"   # 离线去水印
#   - "add_watermark"      # 离线加水印
#   - "remove_background"  # 离线背景去除
#   - "convert_depth"     # 离线图片/视频深度转换
#   - "recognize_text"     # 离线文字识别
#   - "caption_image"      # 本地 EXIF 描述读写

# 场景 B：黑名单 — 只禁用花钱的生成类工具
# tools_disable:
#   - "generate_image"     # 图片生成
#   - "generate_video"     # 视频生成
#   - "generate_speech"    # TTS 语音合成
#   - "generate_music"     # AI 音乐生成
#   - "transcribe_audio"   # STT 语音识别
#   - "midjourney_*"       # Midjourney 全套（含 imagine/describe/reroll/video 等）

# 场景 C：开启 Chat 特权原语（write/edit/bash/search/fetch/web_search/web_fetch 默认关闭，需显式列出）
# tools_enable:
#   - "read"        # 只读原语（read/grep/find/ls）默认即可用，列不列都行
#   - "bash"        # 允许模型执行 shell 命令
#   - "write"       # 允许模型写文件
#   - "edit"        # 允许模型精确改文件
#   - "search"      # 内置联网搜索（DuckDuckGo，免费免 Key）
#   - "fetch"       # 内置抓取网页（本地 readability，免费）
#   - "web_fetch"   # 经第三方 API 抓取（厂商见 defaults.search.provider，可能计费）
#   - "web_search"  # 经第三方 API 联网搜索（同一厂商，可能计费）

# ── MCP 客户端（Chat 连接 MCP 服务器）──
# Chat 可作为 MCP 客户端，接入任意 stdio MCP 服务器，把它们的工具并入 Agent。
# 默认没有内置服务器；想用 aigc-cli 自己的能力，就配一个指向 `aigc-cli mcp` 的 server。
# mcp:
#   servers:
#     - name: aigc
#       command: aigc-cli          # 不在 PATH 时用绝对路径
#       args: ["mcp"]
#       # tools_enable: ["generate_*"]        # 仅暴露匹配工具（glob，空=全部）
#       # tools_disable: ["remove_watermark"] # 排除工具（优先于 enable）
#       # enabled: true                       # 默认 true
#       # env: ["KEY=VALUE"]                  # 追加/覆盖子进程环境变量
#     - name: playwright
#       command: npx
#       args: ["-y", "@playwright/mcp"]
#       tools_enable: ["browser_*"]

# ── 命名 Provider ──
# 定义可复用的 API 账号/端点，名字由用户自定义。
# 在 defaults.{cmd}.provider 中引用。
#
# type 字段标明协议类型（默认 openai）:
#   openai    — OpenAI 兼容协议（OpenAI、OpenRouter、APIMart、任意中转）
#   ollama    — Ollama 本地（OpenAI 子集，无需 API Key）
#   google    — Google Gemini API（预留）
#   anthropic — Anthropic Messages API（通过 OpenRouter 等支持 Anthropic 协议的中转）
#   responses — OpenAI Responses API（chat 专用；解决部分推理模型在 /v1/chat/completions 上拒绝工具调用的问题）
#   local     — 本地 ONNX 模型（OCR / Vision / Detect / Background）
#
# 可选：为单个 Provider 设置 `zdr: true`，让它走零数据保留请求。
# 目前仅 OpenRouter 的 chat/music 支持，其他 Provider/端点忽略该项。
# 未设置时继承全局 zdr；--zdr 命令行参数优先级最高。
#
# 未配置的字段继承全局顶层值（api_key / base_url / http_proxy）。
providers:
# 示例：OpenRouter 专用账号
# openrouter:
#   type: openai
#   api_key: "sk-or-xxx"
#   base_url: "https://openrouter.ai/api/v1"
#   zdr: true

# 示例：音效生成（audio sfx）— ElevenLabs / Stability AI
# 也可以不写这里，直接设 ELEVENLABS_API_KEY / STABILITY_API_KEY 并用 --provider elevenlabs|stability
# elevenlabs:
#   base_url: "https://api.elevenlabs.io"
#   api_key: "xi-xxx"
# stability:
#   base_url: "https://api.stability.ai"
#   api_key: "sk-xxx"

# 示例：阿里云百炼（音乐用 Fun-Music 时配置；chat 走 compatible-mode，音乐会自动改走原生 services 路径）
# dashscope:
#   api_key: "sk-xxx"
#   base_url: "https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"

# 示例：Ollama 本地模型
# ollama:
#   type: ollama
#   base_url: "http://localhost:11434/v1"

# 示例：通过 OpenRouter 使用 Anthropic 协议
# openrouter-anthropic:
#   type: anthropic
#   api_key: "sk-or-xxx"
#   base_url: "https://openrouter.ai/api/v1"

# 示例：OpenAI Responses API（用于支持 reasoning + tools 的模型）
# openlux:
#   type: openai_responses
#   api_key: "sk-xxx"
#   base_url: "https://api.openlux.ai"

# 示例：本地 ONNX 模型目录
# local:
#   type: local
#   models_dir: "~/.config/aigc-cli/models"

# ── 各命令默认值 ──
# Commented-out values use built-in defaults.
# Uncomment only what you want to override.
# Global --model flag overrides per-modality defaults.
defaults:
  # ── 各命令可通过 provider 字段引用命名 Provider，不填则用全局 api_key/base_url ──

  # ── 各命令可通过 provider 字段引用命名 Provider ──
  # 不填则用全局 api_key/base_url
  # 填 "local" 则走本地 ONNX 模型（内置伪 Provider，无需定义）
  #
  # 示例：所有命令共用同一个账号
  # image:
  #   provider: "main-account"
  #   model: "dall-e-3"
  # video:
  #   provider: "main-account"
  # audio:
  #   provider: "main-account"
  # chat:
  #   provider: "main-account"
  #   model: "gpt-4o"

  # ── APIMart 推荐配置（默认不使用命名 Provider）──
  image:
    model: "gpt-image-2-official"
    size: "3:1"
    resolution: "1k"
    quality: "low"
    output_format: "png"
    # timeout: 600              # HTTP 超时 + 异步任务轮询上限（秒）；不填时轮询默认 10 分钟
    # background: "auto"   # auto | opaque | transparent（透明背景需 output_format=png/webp）
  video:
    model: "doubao-seedance-2.0"
    # timeout: 1800             # HTTP 超时 + 异步任务轮询上限（秒）；不填时轮询默认 30 分钟
  audio:
    # timeout: 120               # 音频请求超时（秒）
    speak:
      model: "gpt-4o-mini-tts"
      # provider: "openai-tts"   # 不填则用全局/默认 provider
      voice: "alloy"
      format: "mp3"
    transcribe:
      model: "whisper-tiny"
      # provider: "openai-asr"
      # language: "zh"
    sfx:
      # provider: "local"        # 离线 ONNX（需先 audio init --model stable-audio-open-small）
      provider: "elevenlabs"     # 命名 provider 或内置别名 elevenlabs / stability
      # model: "eleven_text_to_sound_v2"  # ElevenLabs 默认；Stability 用 stable-audio-2.5
      # format: "mp3"             # mp3 | wav
  midjourney:
    speed: "fast"
    version: "6.1"
  music:
    # provider: "apimart"        # apimart（默认）或 openrouter / dashscope（Fun-Music）
    model: "suno" # suno | flowmusic（名称含 flowmusic 走 flowmusic 后端）；OpenRouter 填 google/lyria-3-*；dashscope 填 fun-music-v1 / fun-music-preview
    # timeout: 900               # HTTP 超时 + 异步任务轮询上限（秒）；不填时轮询默认 15 分钟
    # instrumental: false        # 纯音乐（无人声）
    # duration: 120              # 时长（秒），suno 用 duration，flowmusic 用 length；百炼 Fun-Music 不支持
    # format: "mp3"              # 音频格式（suno / OpenRouter / 百炼；flowmusic 不支持）
  chat:
    model: "deepseek-v4-flash"
    max_tokens: 4096 # 最大生成 token 数
    context_size: 32768 # 输入上下文窗口大小（token），0=使用模型默认值。超过 80% 自动压缩
    # tools_on_demand: true # MCP 工具按需加载（search_tools/load_tools），降低上下文占用
    # read_deny: ['\.pem$', '^id_rsa$', '\.env$'] # read 原语拒绝正则（匹配路径或文件名，默认空=全部放行）
    # confirm_tools:            # 执行前需确认的工具正则（匹配 "<tool> <target>"）；缺省 bash/write/edit，[] 关闭
    #   - '^bash\b'
    #   - '^(write|edit) .*\.env$'
  # ── 可选：Web 搜索默认厂商（aigc-cli search / kb search / chat / MCP 共用）──
  # search:
  #   provider: duckduckgo   # 厂商名（duckduckgo / firecrawl / brave / doubao / deepseek / exa / pixabay / pexels）
  decision:
  # provider: "ollama"        # 命名 provider（ollama / openrouter / ...）；不填则用全局
  # model: "tev1"             # tev1 | tev1:0.8b | nimble | typesafe/jev-latest
  # bank: "~/exams/triage.json"  # 默认题库 JSON（未指定 --json 时使用）

  # ── 可选：离线命令对接在线 LLM ──
  # 配置了 provider 则走在线，不配则走本地 ONNX
  # ocr:
  #   provider: "my-openrouter"
  #   model: "gpt-4o"
  # vision:
  #   provider: "my-openrouter"
  #   model: "gpt-4o-vision"
  # detect:
  #   provider: "my-apimart"
  # background:
  #   provider: "my-apimart"

  # ── 可选：图像放大（upscale，本地 ONNX）──
  # 纯本地超分。如需自定义模型目录，指向一个 type: local 的命名 provider（见下方 providers）；
  # 没有在线路径。
  # upscale:
  #   provider: "my-local"              # providers 里 type: local 的条目
  #   model: "realesr-general-x4v3"     # 默认模型（见 'aigc-cli upscale init --list'）

  # ── 可选：知识库（knowledgebase）──
  # knowledgebase:
  #   base_dir: "~/.config/aigc-cli/knowledge"   # 知识库存放路径
  #   auto_save: true                             # kb search 结果是否自动存入 KB（默认 true）
  #   min_score: 0.8                              # 向量搜索结果最低相似度（默认0.8，设0关闭）
  #   embedding_provider: ollama                  # 留空 / local / onnx / hash，或 config.providers 里的名字
  #   embedding_model: embeddinggemma-2:270m     # embedding 模型 id（命名 provider 必填；纯文本用 :270m/:570m 即可）
  #   embedding_timeout: 180                      # 单次 embedding 请求超时秒数（默认 180）

  # ── 可选：灵感检索（ideas）──
  # 配置 embedding_provider 才启用语义检索（BM25 + 向量 RRF 融合）；留空则纯关键词。
  # 文本 embedding 用纯文本小模型即可：embeddinggemma-2:270m（378MB）/ :570m（990MB）。
  # ideas:
  #   data_path: "~/.config/aigc-cli/ideas/ideas.json"  # 提示词数据集路径
  #   embedding_provider: ollama                         # 留空 / local / onnx / hash，或 config.providers 里的名字
  #   embedding_model: embeddinggemma-2:270m
  #   embedding_timeout: 180                             # 单次 embedding 请求超时秒数（默认 180）
  #   embedding_max_runes: 256                           # 入库文本截断长度（默认 256；<=0 不截断，越长越慢）
  #   semantic_top_k: 200                                # 语义列表参与 RRF 的条数（默认 200；<=0 全部）

  # ── 可选：Web / 素材搜索引擎 ──
  # 声明多个 provider 供 aigc-cli search / fetch、kb search 与 chat/MCP 的 web_search/web_fetch 使用。
  # aigc-cli search / kb search 也可通过 --provider 参数临时切换；chat 可用 --search-provider 覆盖。
  # 默认厂商统一在 defaults.search.provider 中配置。
  # defaults:
  #   search:
  #     provider: deepseek   # 可选：厂商名
  # web_search:
  #   duckduckgo:
  #     type: duckduckgo
  #   firecrawl:
  #     type: firecrawl
  #     api_key: "fc-xxx"
  #   doubao:
  #     type: doubao
  #     api_key: "your-doubao-api-key"
  #   deepseek:
  #     type: deepseek
  #     api_key: "sk-xxx"          # DeepSeek Search（自研引擎，5元/1000 次成功请求）
  #   exa:
  #     type: exa
  #     api_key: "exa-xxx"         # Exa 神经搜索（同时提供 Search 与 Contents/Fetch；$10 免费额度/月）
  #   tencent:
  #     type: wsa
  #     api_key: "sk-xxx"          # 腾讯云元宝搜索 API KEY（api.wsa.cloud.tencent.com/SearchPro）
  #   pixabay:
  #     type: pixabay
  #     api_key: "your-pixabay-key"   # 免费 API key；图片（photo/illustration/vector）+ 视频
  #   pexels:
  #     type: pexels
  #     api_key: "your-pexels-key"    # 免费 API key；图片 + 视频
  #   sfxmint:
  #     type: sfxmint                 # 免 API key；CC0 音效库，结果含 WAV/MP3 直链
  #   freesound:
  #     type: freesound
  #     api_key: "your-freesound-key" # 免费 API key；音效库（原档需 OAuth2，CLI 返回预览 MP3）

  # ── 可选：强制走本地 ONNX（无需配 provider）──
  # 命令行 aigc-cli ocr scan x.png --provider local 即可

