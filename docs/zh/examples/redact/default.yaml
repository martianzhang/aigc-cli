# 模型：privyscope zh-Hans（Apache-2.0，https://github.com/zafrem/privyscope-zh-hans）
# 安装：aigc-cli redact init --model zh-pii
# 中英混合 NER：aigc-cli redact init --model multilingual-ner（把下面的 model 改为 multilingual-ner）
# default —— 日常脱敏：纯规则，placeholder + mapping 可还原
style: placeholder
engine: rules              # rules | model | auto
model_engine: auto         # auto | chatner | tokencls
chatner:
  occurrence: anchored     # 只在角色词附近替换；歧义项进入 needs_review
  anchor_window: 20
tokencls:
  model: zh-pii
  max_len: 256
  stride: 64
  operating_point: high_recall
