# aigc-cli Configuration (example file - the copy in the repo is not used)
# Copy it to ~/.config/aigc-cli/config.yaml and fill in your own keys:
#   mkdir -p ~/.config/aigc-cli && cp docs/en/examples/config.yaml ~/.config/aigc-cli/config.yaml
# or pass --config /path/to/config.yaml at runtime
# ⚠️ Do not run `aigc-cli config ...` against this file: the CLI rewrites it in place and encrypts its keys

# ── Global Top-Level Config ──
# Fallback for all commands. When a command doesn't reference a named provider
# via defaults.{cmd}.provider, these global values are used.
# If a providers section is defined and a command references a named provider,
# those values take priority.

# API key (can also be set via OPENAI_API_KEY env var)
# Optional when using local models (Ollama / LM Studio / localhost)
api_key: "your-api-key-here"

# API base URL (can also be set via OPENAI_BASE_URL env var)
# ── Uncomment per provider ──
# OpenAI:    https://api.openai.com/v1
# OpenRouter: https://openrouter.ai/api/v1
# APIMart:    https://api.apimart.ai
# Ollama:    http://localhost:11434 (no API Key needed)
# Any relay: https://your-relay.com/v1
base_url: "https://api.apimart.ai"

# HTTP proxy (can also be set via HTTP_PROXY / HTTPS_PROXY env vars, or --http-proxy CLI flag)
# Use the --no-proxy CLI flag to bypass this setting for a single run.
# http_proxy: "http://127.0.0.1:7890"

# Verbose output: show full result JSON (can also use --verbose / -v CLI flag)
# verbose: true

# Zero data retention: restrict OpenRouter chat/music to ZDR-compliant upstreams.
# Can also use the global --zdr CLI flag (the flag overrides this value).
# Ignored by every other provider and by OpenRouter image/video.
# zdr: true

# Output directory for downloaded files (default: current directory ".")
# Can also use --output CLI flag
# output_dir: "./downloads"

# OpenRouter app attribution (optional)
# Set via env vars: OPENAI_REFERER="https://your-site.com" OPENAI_APP_TITLE="Your App"

# Global timeout in seconds for HTTP requests (default: 180s).
# Modality-specific timeout overrides this if set.
# This key only bounds a single HTTP request; async task polling uses
# defaults.<modality>.timeout (and per-media built-in defaults) instead.
# timeout: 300

# ── Tool Filtering (MCP / Chat mode) ──
# Glob patterns (* matches any name):
#   tools_enable  — Allowlist mode, only listed tools are enabled (empty = all allowed)
#   tools_disable — Blocklist mode, disable listed tools (applied on top of allowlist)
# When both are set, enable filter runs first, then disable exclusion.
# Chat primitives: read/grep/find/ls are on by default (read-only); write/edit/bash/search/fetch/web_search/web_fetch
# are privileged and require an explicit tools_enable entry. Domain tools (generate_*, …) come from MCP.

# Scenario A: Allowlist — only free/offline tools (local ONNX / BM25)
# tools_enable:
#   - "search_ideas"       # Local BM25 idea search (MCP + Chat)
#   - "detect_image"       # Offline AIGC detection
#   - "remove_watermark"   # Offline watermark removal
#   - "add_watermark"      # Offline watermark addition
#   - "remove_background"  # Offline background removal
#   - "convert_depth"     # Offline image/video → depth map conversion
#   - "recognize_text"     # Offline text recognition
#   - "caption_image"      # Local EXIF description read/write

# Scenario B: Blocklist — only disable paid generation tools
# tools_disable:
#   - "generate_image"     # Image generation
#   - "generate_video"     # Video generation
#   - "generate_speech"    # TTS speech synthesis
#   - "generate_music"     # AI music generation
#   - "transcribe_audio"   # STT speech recognition
#   - "midjourney_*"       # Midjourney suite (imagine/describe/reroll/video etc.)

# Scenario C: enable chat privileged primitives (write/edit/bash/search/fetch/web_search/web_fetch are off by default)
# tools_enable:
#   - "read"        # read-only primitives (read/grep/find/ls) are on by default anyway
#   - "bash"        # let the model run shell commands
#   - "write"       # let the model write files
#   - "edit"        # let the model edit files precisely
#   - "search"      # built-in web search (DuckDuckGo; free, no key)
#   - "fetch"       # built-in web fetch (local readability; free)
#   - "web_fetch"   # fetch via a third-party API (vendor: defaults.search.provider; may be billed)
#   - "web_search"  # search via a third-party API (same vendor; may be billed)

# ── MCP Client (Chat connects to MCP servers) ──
# Chat acts as an MCP client: it connects to arbitrary stdio MCP servers and
# merges their tools into the agent's toolset. There is NO built-in server — to
# use aigc-cli's own AIGC tools from chat, add an entry pointing at `aigc-cli mcp`.
# mcp:
#   servers:
#     - name: aigc
#       command: aigc-cli          # use an absolute path if not on $PATH
#       args: ["mcp"]
#       # tools_enable: ["generate_*"]        # expose only matching tools (glob, empty = all)
#       # tools_disable: ["remove_watermark"] # exclude tools (wins over enable)
#       # enabled: true                       # default true
#       # env: ["KEY=VALUE"]                  # extra env for the child process
#     - name: playwright
#       command: npx
#       args: ["-y", "@playwright/mcp"]
#       tools_enable: ["browser_*"]

# ── Named Providers ──
# Define reusable API accounts/endpoints. Names are user-defined.
# Referenced via defaults.{cmd}.provider.
#
# The type field specifies the protocol (default: openai):
#   openai    — OpenAI-compatible protocol (OpenAI, OpenRouter, APIMart, any relay)
#   ollama    — Ollama local (OpenAI subset, no API Key needed)
#   google    — Google Gemini API (reserved)
#   anthropic — Anthropic Messages API (via OpenRouter or other Anthropic-compatible relays)
#   responses — OpenAI Responses API (chat only; fixes reasoning models that reject tools on /v1/chat/completions)
#   local     — Local ONNX models (OCR / Vision / Detect / Background)
#
# Optional per-provider `zdr: true` opts that provider into zero-data-retention
# requests. Only OpenRouter chat/music honor it; ignored elsewhere. Unset inherits
# the global zdr; the --zdr CLI flag overrides both.
#
# Unconfigured fields inherit global top-level values (api_key / base_url / http_proxy).
providers:
  # Example: OpenRouter dedicated account
  # openrouter:
  #   type: openai
  #   api_key: "sk-or-xxx"
  #   base_url: "https://openrouter.ai/api/v1"
  #   zdr: true

  # Example: sound effects (audio sfx) — ElevenLabs / Stability AI
  # You can also skip this and just set ELEVENLABS_API_KEY / STABILITY_API_KEY with --provider elevenlabs|stability
  # elevenlabs:
  #   base_url: "https://api.elevenlabs.io"
  #   api_key: "xi-xxx"
  # stability:
  #   base_url: "https://api.stability.ai"
  #   api_key: "sk-xxx"

  # Example: Alibaba Cloud Bailian (needed for Fun-Music; chat uses compatible-mode,
  # music is automatically redirected to the native services path)
  # dashscope:
  #   api_key: "sk-xxx"
  #   base_url: "https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"

  # Example: Ollama local model
  # ollama:
  #   type: ollama
  #   base_url: "http://localhost:11434/v1"

  # Example: Anthropic protocol via OpenRouter
  # openrouter-anthropic:
  #   type: anthropic
  #   api_key: "sk-or-xxx"
  #   base_url: "https://openrouter.ai/api/v1"

  # Example: OpenAI Responses API (for reasoning models that support tools + reasoning)
  # openlux:
  #   type: openai_responses
  #   api_key: "sk-xxx"
  #   base_url: "https://api.openlux.ai"

  # Example: Local ONNX model directory
  # local:
  #   type: local
  #   models_dir: "~/.config/aigc-cli/models"

# ── Command Defaults ──
# Commented-out values use built-in defaults.
# Uncomment only what you want to override.
# Global --model flag overrides per-modality defaults.
defaults:
  # ── Each command can reference a named provider via the provider field ──
  # Leave empty to use global api_key/base_url.
  # Set to "local" for built-in ONNX models (no definition needed).
  #
  # Example: all commands share one account
  # image:
  #   provider: "main-account"
  #   model: "dall-e-3"
  # video:
  #   provider: "main-account"
  # audio:
  #   provider: "main-account"
  # chat:
  #   provider: "main-account"
  #   model: "gpt-4o"

  # ── APIMart Recommended Config (default, no named provider used) ──
  image:
    model: "gpt-image-2-official"
    size: "3:1"
    resolution: "1k"
    quality: "low"
    output_format: "png"
    # timeout: 600               # HTTP timeout + async task polling deadline (s); polling defaults to 10m
    # background: "auto"   # auto | opaque | transparent (requires output_format=png/webp)

  video:
    model: "doubao-seedance-2.0"
    # timeout: 1800              # HTTP timeout + async task polling deadline (s); polling defaults to 30m

  audio:
    # timeout: 120               # audio request timeout (seconds)
    speak:
      model: "gpt-4o-mini-tts"
      # provider: "openai-tts"   # unset = global/default provider
      voice: "alloy"
      format: "mp3"
    transcribe:
      model: "whisper-tiny"
      # provider: "openai-asr"
      # language: "zh"
    sfx:
      # provider: "local"        # 离线 ONNX（需先 audio init --model stable-audio-open-small）
      provider: "elevenlabs"     # named provider or built-in alias elevenlabs / stability
      # model: "eleven_text_to_sound_v2"  # ElevenLabs default; Stability uses stable-audio-2.5
      # format: "mp3"             # mp3 | wav

  midjourney:
    speed: "fast"
    version: "6.1"

  music:
    # provider: "apimart"        # apimart (default), openrouter, or dashscope (Fun-Music)
    model: "suno"                # suno | flowmusic (flowmusic if the name contains it); OpenRouter: google/lyria-3-*; dashscope: fun-music-v1 / fun-music-preview
    # timeout: 900               # HTTP timeout + async task polling deadline (s); polling defaults to 15m
    # instrumental: false        # true = no vocals
    # duration: 120              # seconds (suno: duration, flowmusic: length); not supported by Bailian Fun-Music
    # format: "mp3"              # audio format (suno / OpenRouter / Bailian; flowmusic not supported)

  chat:
    model: "deepseek-v4-flash"
    max_tokens: 4096            # Max response tokens
    context_size: 32768         # Max input context tokens; 0=model default. Auto-compacts at 80%
    # tools_on_demand: true     # Load MCP tools on demand (search_tools/load_tools) to save context
    # read_deny: ['\.pem$', '^id_rsa$', '\.env$']  # read primitive denylist regexes (path or basename; empty = allow all)
  # ── Optional: shared web-search vendor (aigc-cli search / kb search / chat / MCP)──
  # search:
  #   provider: duckduckgo   # vendor name (duckduckgo / firecrawl / brave / doubao / deepseek / exa / pixabay / pexels)

  decision:
    # provider: "ollama"        # named provider (ollama / openrouter / ...); unset uses global
    # model: "tev1"             # tev1 | tev1:0.8b | nimble | typesafe/jev-latest
    # bank: "~/exams/triage.json"  # default question bank JSON (used when --json is omitted)

  # ── Optional: offline commands with online LLM ──
  # Setting a provider routes to online API; unset uses local ONNX.
  # ocr:
  #   provider: "my-openrouter"
  #   model: "gpt-4o"
  # vision:
  #   provider: "my-openrouter"
  #   model: "gpt-4o-vision"
  # detect:
  #   provider: "my-apimart"
  # background:
  #   provider: "my-apimart"

  # ── Optional: Image upscaling (upscale, local ONNX) ──
  # Fully local super-resolution. To customize the models directory, point it at
  # a named provider with type: local (see providers); there is no online path.
  # upscale:
  #   provider: "my-local"              # a providers entry with type: local
  #   model: "realesr-general-x4v3"     # default model (see 'aigc-cli upscale init --list')

  # ── Optional: Knowledge Base (knowledgebase) ──
  # knowledgebase:
  #   base_dir: "~/.config/aigc-cli/knowledge"   # KB storage path
  #   auto_save: true                             # Auto-save kb search results to KB (default: true)
  #   min_score: 0.8                              # Minimum similarity for vector search (default 0.8, 0 to disable)
  #   embedding_provider: ollama                  # "" / local / onnx / hash, or a name in config.providers
  #   embedding_model: embeddinggemma-2:270m     # embedding model id (required for a named provider; text-only :270m/:570m suffice)
  #   embedding_timeout: 180                      # per-request embedding timeout in seconds (default 180)

  # ── Optional: Idea search (ideas) ──
  # Semantic search (BM25 + vector RRF) turns on only when embedding_provider is set;
  # leave it empty for keyword-only search.
  # Text embeddings need only a small text-only model: embeddinggemma-2:270m (378MB)
  # or :570m (990MB). :latest / :740m are multimodal and unnecessary for text.
  # ideas:
  #   data_path: "~/.config/aigc-cli/ideas/ideas.json"  # prompt dataset path
  #   embedding_provider: ollama                         # "" / local / onnx / hash, or a name in config.providers
  #   embedding_model: embeddinggemma-2:270m
  #   embedding_timeout: 180                             # per-request embedding timeout in seconds (default 180)
  #   embedding_max_runes: 256                           # truncate embedded text (default 256; <=0 = no truncation, slower)
  #   semantic_top_k: 200                                # entries the semantic list contributes to RRF (default 200; <=0 = all)

  # ── Optional: Web / Media Search Providers ──
  # Declare multiple providers for auto-fallback, shared by `aigc-cli search` /
  # `fetch`, `kb search`, and the chat/MCP web_search/web_fetch tools.
  # `aigc-cli search` / `kb search` also support a --provider flag; chat can
  # override via --search-provider.
  # The shared default lives in defaults.search.provider.
  # defaults:
  #   search:
  #     provider: deepseek   # optional: a vendor name
  # web_search:
  #   duckduckgo:
  #     type: duckduckgo
  #   firecrawl:
  #     type: firecrawl
  #     api_key: "fc-xxx"
  #   doubao:
  #     type: doubao
  #     api_key: "your-doubao-api-key"
  #   deepseek:
  #     type: deepseek
  #     api_key: "sk-xxx"          # DeepSeek Search (in-house engine, $0.75/1000 successful requests)
  #   exa:
  #     type: exa
  #     api_key: "exa-xxx"
  #   tencent:
  #     type: wsa
  #     api_key: "sk-xxx"          # Tencent Yuanbao Search API KEY (api.wsa.cloud.tencent.com/SearchPro)         # Exa neural search (Search + Contents/Fetch; $10 free credit/month)
  #   pixabay:
  #     type: pixabay
  #     api_key: "your-pixabay-key"   # free API key; photos (photo/illustration/vector) + videos
  #   pexels:
  #     type: pexels
  #     api_key: "your-pexels-key"    # free API key; photos + videos
  #   sfxmint:
  #     type: sfxmint                 # no API key; CC0 sound effects with direct WAV/MP3 URLs
  #   freesound:
  #     type: freesound
  #     api_key: "your-freesound-key" # free API key; sound effects (originals need OAuth2, CLI returns preview MP3)

  # ── Optional: Force local ONNX (no provider config needed) ──
  # Just run: aigc-cli ocr scan x.png --provider local

# ── Typical Configuration Scenarios ──

# Scenario A: Multiple commands share one account
# providers:
#   main:
#     api_key: "sk-xxx"
#     base_url: "https://api.apimart.ai"
# defaults:
#   image:
#     provider: "main"
#   video:
#     provider: "main"
#   audio:
#     provider: "main"

# Scenario B: Different vendors
# providers:
#   or:
#     type: openai
#     api_key: "sk-or-xxx"
#     base_url: "https://openrouter.ai/api/v1"
#   local:
#     type: ollama
#     base_url: "http://localhost:11434/v1"
# defaults:
#   image:
#     provider: "or"
#     model: "openai/gpt-image-2"
#   chat:
#     provider: "local"
#   audio:
#     provider: "or"

# Scenario C: Offline commands use local, online commands use cloud
# providers:
#   online:
#     api_key: "sk-xxx"
#     base_url: "https://api.apimart.ai"
# defaults:
#   chat:
#     provider: "online"
#   ocr:                          # No provider → local ONNX
#   vision:                       # Same as above

# Scenario D: Backward compatible (no providers section at all)
# api_key: "sk-xxx"
# base_url: "https://api.apimart.ai"
# Behavior is identical to v1.x
